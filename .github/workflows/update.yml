name: update-radar

on:
  schedule:
    - cron: "20 6 * * *"   # tous les jours 06:20 UTC (~08:20 Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collecte des indicateurs + juge LLM
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/update.py
      - name: Commit data.json si modifié
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet && echo "rien à committer" && exit 0
          git commit -m "data: mise à jour quotidienne"
          # robuste à une course : rebase puis retry jusqu'à 5 fois
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejeté (tentative $i) — rebase et retry"
            git pull --rebase -X ours origin main || git rebase --abort
            sleep 3
          done
          echo "push impossible après 5 tentatives" && exit 1
      - name: Email résumé quotidien
        continue-on-error: true
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: python3 scripts/send_email.py
